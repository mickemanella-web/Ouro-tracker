name: Atualizar dados do Bitcoin

on:
  schedule:
    - cron: "0 6 * * *"  # todos os dias às 06:00 UTC
  workflow_dispatch: {}  # permite rodar manualmente pelo GitHub

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install yfinance pandas

      - name: Rodar script de atualização
        run: python atualizar_bitcoin.py

      - name: Commit e push se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add retornos_bitcoin.json
          git diff --staged --quiet || git commit -m "Atualizacao automatica de dados do Bitcoin $(date +%Y-%m-%d)"
          git push
